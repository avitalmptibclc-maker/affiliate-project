<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>יועצות ההנקה של אילת - להתחלה רכה</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&family=Playpen+Sans+Hebrew:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />

  <!-- זירוז: פתיחת חיבורים מוקדמת לשרתי ה-CDN (מקצר זמן טעינה) -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ספריות מ-CDN (קובץ עצמאי שעובד בכל מקום) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel הוסר: הקוד מקומפל מראש ל-app.js (זירוז טעינה) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Rubik', Arial, sans-serif; }
    .font-statement { font-family: 'Playpen Sans Hebrew', 'Rubik', cursive; }

    /* ====== נגישות: תשתית (ת"י 5568 רמה AA — ראו ACCESSIBILITY.md) ====== */

    /* 1. סימון פוקוס נראה לעין — קריטי לניווט במקלדת. אין להסיר. */
    :focus-visible {
      outline: 3px solid #12313f !important;
      outline-offset: 2px !important;
      border-radius: 6px;
    }
    html.a11y-contrast :focus-visible { outline-color: #ff0 !important; }

    /* 2. קישור "דילוג לתוכן הראשי" — מוסתר עד שמגיעים אליו ב-Tab */
    .skip-link {
      position: fixed; right: 12px; top: -80px; z-index: 200;
      background: #fff; color: #12313f; border: 2px solid #12313f;
      padding: 10px 18px; border-radius: 12px; font-weight: 700;
      text-decoration: none; transition: top .15s ease;
    }
    .skip-link:focus { top: 12px; }
    main:focus { outline: none; }

    /* 3. טקסט למקריא מסך בלבד (לא נראה על המסך, כן מוקרא) */
    .sr-only {
      position: absolute !important; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* 4. מצבי רכיב הנגישות */
    html.a11y-font-1 { font-size: 112.5%; }
    html.a11y-font-2 { font-size: 125%; }
    html.a11y-readable, html.a11y-readable * { font-family: Arial, 'Helvetica Neue', sans-serif !important; letter-spacing: .01em; }
    html.a11y-links a { text-decoration: underline !important; }
    html.a11y-contrast body { background: #000 !important; }
    html.a11y-contrast *:not(svg):not(path):not(img) { color: #fff !important; border-color: #555 !important; background-image: none !important; }
    html.a11y-contrast .bg-white, html.a11y-contrast nav, html.a11y-contrast header, html.a11y-contrast [class*="bg-["] { background: #111 !important; }
    html.a11y-contrast a, html.a11y-contrast button { color: #ff0 !important; }
    html.a11y-contrast input, html.a11y-contrast textarea, html.a11y-contrast select { background: #000 !important; color: #fff !important; border-color: #ff0 !important; }
    html.a11y-contrast .skip-link { background: #000 !important; color: #ff0 !important; border-color: #ff0 !important; }

    /* 5. הפחתת תנועה — גם לפי הגדרת המערכת וגם לפי מתג ברכיב הנגישות */
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; } }
    html.a11y-no-motion *, html.a11y-no-motion *::before, html.a11y-no-motion *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  </style>
</head>
<body>
  <!-- נגישות: דילוג לתוכן הראשי — מופיע רק בניווט במקלדת (Tab) -->
  <a class="skip-link" href="#main">דילוג לתוכן הראשי</a>
  <div id="root"></div>

  <script defer src="app.js"></script>
</body>
</html>
