<!DOCTYPE html>

<head>

  <!-- זירוז: פתיחת חיבורים מוקדמת לשרתי ה-CDN (מקצר זמן טעינה) -->

  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;

    body {

    /* ====== נגישות: תשתית (ת"י 5568 רמה AA — ראו ACCESSIBILITY.md) ====== */

    /* 1. סימון פוקוס נראה לעין — קריטי לניווט במקלדת. אין להסיר. */
    :focus-visible {
      outline: 3px solid #12313f !important;
      outline-offset: 2px !important;
      border-radius: 6px;
    }
    html.a11y-contrast :focus-visible { outline-color: #ff0 !important; }

    /* 2. קישור "דילוג לתוכן הראשי" — מוסתר עד שמגיעים אליו ב-Tab */
    .skip-link {
      position: fixed; right: 12px; top: -80px; z-index: 200;
      background: #fff; color: #12313f; border: 2px solid #12313f;
      padding: 10px 18px; border-radius: 12px; font-weight: 700;
      text-decoration: none; transition: top .15s ease;
    }
    .skip-link:focus { top: 12px; }
    main:focus { outline: none; }

    /* 3. טקסט למקריא מסך בלבד (לא נראה על המסך, כן מוקרא) */
    .sr-only {
      position: absolute !important; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;

    /* 4. מצבי רכיב הנגישות */
    html.a11y-font-1 { font-size: 112.5%; }
    html.a11y-font-2 { font-size: 125%; }
    html.a11y-readable, html.a11y-readable * { font-family: Arial, 'Helvetica Neue', sans-serif !important; letter-spacing: .01em; }
    html.a11y-links a { text-decoration: underline !important; }
    html.a11y-contrast body { background: #000 !important; }
    html.a11y-contrast *:not(svg):not(path):not(img) { color: #fff !important; border-color: #555 !important; background-image: none !important; }
    html.a11y-contrast .bg-white, html.a11y-contrast nav, html.a11y-contrast header, html.a11y-contrast [class*="bg-["] { background: #111 !important; }
    html.a11y-contrast a, html.a11y-contrast button { color: #ff0 !important; }
    html.a11y-contrast input, html.a11y-contrast textarea, html.a11y-contrast select { background: #000 !important; color: #fff !important; border-color: #ff0 !important; }
    html.a11y-contrast .skip-link { background: #000 !important; color: #ff0 !important; border-color: #ff0 !important; }

    /* 5. הפחתת תנועה — גם לפי הגדרת המערכת וגם לפי מתג ברכיב הנגישות */
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; } }
    html.a11y-no-motion *, html.a11y-no-motion *::before, html.a11y-no-motion *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }

</head>
<body>
  <!-- נגישות: דילוג לתוכן הראשי — מופיע רק בניווט במקלדת (Tab) -->
  <a class="skip-link" href="#main">דילוג לתוכן הראשי</a>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    /* ============================================================
       ⚙️  הגדרות — זה כל מה שצריך לשנות כדי לשכפל ללקוח/ה חדש/ה
       ============================================================
       1. SITE_PREFIX  — קידומת ייחודית באנגלית (קובעת את שם הטבלה ב-Supabase).
       2. ADMIN_CODE   — סיסמת הניהול של הלקוח/ה.
       3. BRAND_NAME / HERO_TITLE / HERO_INTRO — טקסטים התחלתיים (ניתנים לעריכה גם מהניהול).
       4. SUPABASE_URL / SUPABASE_ANON_KEY — מתוך פרויקט ה-Supabase של הלקוח/ה.
       כל השאר (תמונה, רקע, כותרות, מגירות, הסברים, פונטים, מוצרים) נערך מפאנל הניהול.
       ============================================================ */
    const SITE_PREFIX = "physiomation";     // טבלה: physiomation_products
    const ADMIN_CODE  = "5845";             // סיסמת ניהול (אפשר לשנות)
    const BRAND_NAME  = "פיזיומיישן";       // מופיע בכותרת לשונית הדפדפן
    const HERO_TITLE  = "פיזיומיישן";        // כותרת ראשית — ערכי דרך הניהול
    const HERO_INTRO  = "אני סאקרית של ציוד הכי טוב שיש. תמיד יש לי את הטלפון הכי מתקדם, את המחשב הכי מהיר. אין מה לעשות — אוהבת גאדג'טים שעובדים, ועובדים היטב 🎬";

    const TABLE = `${SITE_PREFIX}_products`;

    /* ====== חיבור ל-Supabase (הפרויקט של אביטל) ====== */
    const SUPABASE_URL = "https://ucodslcraqotfkjpbqvm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjb2RzbGNyYXFvdGZranBicXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NTc0MDksImV4cCI6MjA5NzAzMzQwOX0.pZPR3XRqiy_hiwgI8NEsEAGo_3XBNiEdKrwgypcgI8A";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ====== ארבע המגירות — שמות ברירת מחדל (הלקוח/ה משנה בניהול) ====== */
    const CATEGORIES = [
      { key: 'cat1', label: 'מיקרופונים', emoji: '🎙️', color: '#C26A4B', soft: '#F3E3DA' }, // נחושת
      { key: 'cat2', label: 'חצובות',     emoji: '📷', color: '#3E9B8C', soft: '#DCEFEB' }, // טורקיז
      { key: 'cat3', label: 'תאורה',      emoji: '💡', color: '#9E84C9', soft: '#ECE6F4' }, // לבנדר
      { key: 'cat4', label: 'אביזרים',    emoji: '🎬', color: '#357C71', soft: '#DCEBE8' }, // טורקיז כהה
      { key: 'cat5', label: 'סדנאות דיגיטליות', emoji: '🎓', color: '#C99A5B', soft: '#F3E9D8' }, // זהב — לרכישה מיידית
    ];
    const catOf = (key) => CATEGORIES.find(c => c.key === key) || CATEGORIES[0];

    /* ====== אייקונים ====== */
    const Icon = ({ children, size = 20, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true" focusable="false">{children}</svg>
    );
    const Chevron = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9" /></Icon>;
    const ExternalLink = (p) => <Icon {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></Icon>;
    const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></Icon>;
    const Trash = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></Icon>;
    const Pencil = (p) => <Icon {...p}><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></Icon>;
    const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
    const Back = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 19 19 12 12 5" /></Icon>;
    const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></Icon>;
    const Accessibility = (p) => <Icon {...p}><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none" /><path d="M5 8h14" /><path d="M12 8v7" /><path d="M12 15l-3.5 5" /><path d="M12 15l3.5 5" /></Icon>;

    /* ====== ספריית אייקונים לבחירה (קו עדין) ====== */
    const ICON_LIBRARY = {
      heart:    (p) => <Icon {...p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.49 4.04 3 5.5l7 7Z" /></Icon>,
      baby:     (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M9 14c.83.67 1.83 1 3 1s2.17-.33 3-1" /><path d="M9 10h.01" /><path d="M15 10h.01" /></Icon>,
      droplet:  (p) => <Icon {...p}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" /></Icon>,
      star:     (p) => <Icon {...p}><polygon points="12 2 15 9 22 9.5 17 14 18.5 21 12 17 5.5 21 7 14 2 9.5 9 9" /></Icon>,
      sparkles: (p) => <Icon {...p}><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z" /></Icon>,
      sun:      (p) => <Icon {...p}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4" /></Icon>,
      moon:     (p) => <Icon {...p}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></Icon>,
      flower:   (p) => <Icon {...p}><circle cx="12" cy="12" r="2.5" /><circle cx="12" cy="6.5" r="2.5" /><circle cx="12" cy="17.5" r="2.5" /><circle cx="6.5" cy="12" r="2.5" /><circle cx="17.5" cy="12" r="2.5" /></Icon>,
      leaf:     (p) => <Icon {...p}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" /><path d="M2 21c0-3 1.85-5.36 5.08-6" /></Icon>,
      gift:     (p) => <Icon {...p}><rect x="3" y="8" width="18" height="4" rx="1" /><path d="M12 8v13" /><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" /><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8" /><path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8" /></Icon>,
      smile:    (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2" /><path d="M9 9h.01" /><path d="M15 9h.01" /></Icon>,
      crown:    (p) => <Icon {...p}><path d="M2 7l5 5 5-7 5 7 5-5-2.2 12H4.2z" /></Icon>,
      bell:     (p) => <Icon {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></Icon>,
      flame:    (p) => <Icon {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z" /></Icon>,
      award:    (p) => <Icon {...p}><circle cx="12" cy="8" r="6" /><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" /></Icon>,
      feather:  (p) => <Icon {...p}><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" /><path d="M16 8 2 22" /><path d="M17.5 15H9" /></Icon>,
    };
    const DEFAULT_ICONS = { cat1: 'heart', cat2: 'star', cat3: 'droplet', cat4: 'smile', cat5: 'award' };

    /* הגדרות שניתנות לעריכה דרך הניהול */
    const DEFAULT_TITLE = HERO_TITLE;
    const DEFAULT_SUBTITLE = HERO_INTRO;
    const DEFAULT_FONTS = {
      title: 'Playpen Sans Hebrew', subtitle: 'Varela Round',
      drawerTitle: 'Playpen Sans Hebrew', drawerDesc: 'Varela Round', productText: 'Varela Round',
    };
    const DEFAULT_SETTINGS = {
      title: DEFAULT_TITLE,
      subtitle: DEFAULT_SUBTITLE,
      icons: DEFAULT_ICONS,
      labels: Object.fromEntries(CATEGORIES.map(c => [c.key, c.label])),
      descs: Object.fromEntries(CATEGORIES.map(c => [c.key, ''])),
      fonts: DEFAULT_FONTS,
      bg: '',
      banners: [],
    };
    const mergeSettings = (b, o = {}) => ({
      title:    o.title    !== undefined ? o.title    : b.title,
      subtitle: o.subtitle !== undefined ? o.subtitle : b.subtitle,
      icons:  { ...b.icons,  ...(o.icons  || {}) },
      labels: { ...b.labels, ...(o.labels || {}) },
      descs:  { ...b.descs,  ...(o.descs  || {}) },
      fonts:  { ...b.fonts,  ...(o.fonts  || {}) },
      bg: o.bg !== undefined ? o.bg : b.bg,
      // תאימות לאחור: hero בודד -> מערך banners
      banners: o.banners !== undefined ? o.banners : (o.hero ? [o.hero] : b.banners),
    });

    const CatIconCtx = React.createContext({});
    const CatIcon = ({ k, size = 22, color }) => {
      const choices = React.useContext(CatIconCtx);
      const name = (choices && choices[k]) || DEFAULT_ICONS[k] || 'heart';
      const C = ICON_LIBRARY[name] || ICON_LIBRARY.heart;
      return <span style={{ color, display: 'inline-flex' }}><C size={size} /></span>;
    };

    /* ====== ספריית פונטים (כולם תומכי עברית) ====== */
    const FONTS = [
      'Playpen Sans Hebrew', 'Varela Round', 'Heebo', 'Assistant', 'Rubik', 'Alef',
      'Frank Ruhl Libre', 'Bellefair', 'David Libre', 'Miriam Libre', 'Noto Serif Hebrew',
      'Suez One', 'Secular One', 'Karantina', 'Gveret Levin', 'Amatic SC',
      'Rubik Doodle Shadow', 'Rubik Dirt', 'Rubik Wet Paint',
    ];
    const fontCss = (name) => name ? `'${name}', 'Varela Round', sans-serif` : "'Varela Round', sans-serif";
    // טוען מ-Google Fonts רק את הפונטים שבשימוש בפועל
    const ensureFonts = (fonts) => {
      const fams = [...new Set(Object.values(fonts || {}).filter(Boolean))];
      if (!fams.length) return;
      const href = 'https://fonts.googleapis.com/css2?' +
        fams.map(f => 'family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@400;500;700').join('&') +
        '&display=swap';
      let link = document.getElementById('dyn-fonts');
      if (!link) { link = document.createElement('link'); link.id = 'dyn-fonts'; link.rel = 'stylesheet'; document.head.appendChild(link); }
      if (link.href !== href) link.href = href;
    };
    const FontsCtx = React.createContext(DEFAULT_FONTS);

    /* ====== נגישות: הכהיית צבע לשימוש בטקסט ======
       צבעי המגירות בהירים ויפים כרקע, אבל ככיתוב על רקע לבן הם לא קריאים מספיק.
       הפונקציה מכהה את הצבע (באותו גוון) עד ליחס ניגודיות 4.5:1 לפחות — דרישת ת"י 5568 ברמת AA.
       כך גם צבע חדש שנבחר בממשק הניהול יישאר תמיד קריא. */
    const relLum = (hex) => {
      const m = /^#?([0-9a-fA-F]{6})$/.exec(hex || '');
      if (!m) return 1;
      const ch = [0, 2, 4].map(i => {
        let v = parseInt(m[1].substr(i, 2), 16) / 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
    };
    const textInk = (hex, bg = '#ffffff') => {
      const m = /^#?([0-9a-fA-F]{6})$/.exec(hex || '');
      if (!m) return hex;
      let rgb = [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16));
      const bgL = relLum(bg);
      const ratio = (c) => (bgL + 0.05) / (relLum('#' + c.map(v => v.toString(16).padStart(2, '0')).join('')) + 0.05);
      for (let i = 0; i < 40 && ratio(rgb) < 4.5; i++) rgb = rgb.map(v => Math.max(0, Math.round(v * 0.92)));
      return '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('');
    };

    /* ====== המרת נתונים ====== */
    const fromDb = (r) => ({ id: r.id, category: r.category, title: r.title || '', description: r.description || '', url: r.url || '', image: r.image || '' });
    const toDb   = (p) => ({ category: p.category, title: p.title || '', description: p.description || '', url: p.url || '', image: p.image || null });

    /* ====== תמונת פרופיל של אביטל ======
       משתמשת בתמונה שהועלתה מהניהול (src). אם אין — מציגה עיגול עם האות א. */
    const ProfilePic = ({ size = 120, src }) => {
      if (src) return <img src={src} style={{ width: size, height: size }}
        className="mx-auto rounded-full object-cover shadow-md border-4 border-white" alt="אביטל עציון" />;
      return (
        <div style={{ width: size, height: size }} className="mx-auto rounded-full bg-gradient-to-tr from-[#ED8888] to-[#C59976] flex items-center justify-center text-[#2b1a10] text-4xl font-extrabold shadow-md">א</div>
      );
    };

    /* ====== הקטנת תמונה לפני שמירה (כדי לא לשמור קובץ ענק) ====== */
    const resizeImage = (file, cb, max = 512) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    const INPUT = "w-full px-4 py-3 rounded-xl border border-[#e7d8cd] bg-white focus:outline-none focus:ring-2 focus:ring-[#ED8888] text-[#263238]";
    const EMPTY = { category: 'cat1', title: '', description: '', url: '', image: '' };

    /* ====== כרטיס מוצר (תצוגה ציבורית) ====== */
    const ProductCard = ({ p }) => {
      const c = catOf(p.category);
      const fonts = React.useContext(FontsCtx);
      const [copied, setCopied] = useState(false);
      const cMatch = (p.description || '').match(/(?:קוד\s*קופון|קופון|coupon|promo\s*code|code)\s*[:\-]?\s*([A-Za-z0-9]{3,16})/i);
      const code = cMatch ? cMatch[1] : '';
      const copyCode = (e) => {
        e.preventDefault(); e.stopPropagation();
        if (navigator.clipboard) navigator.clipboard.writeText(code);
        setCopied(true); setTimeout(() => setCopied(false), 1500);
      };
      return (
        <a href={p.url} target="_blank" rel="sponsored noopener noreferrer"
          className="group w-full h-full flex flex-col bg-white rounded-2xl overflow-hidden shadow-sm border border-[#f0e3d8] active:scale-[.99] hover:shadow-md hover:-translate-y-0.5 transition-all"
          style={{ fontFamily: fontCss(fonts.productText) }}>
          <div className="w-full aspect-square flex items-center justify-center overflow-hidden border-b border-[#f3e7dd]"
            style={{ background: p.image ? '#fff' : `linear-gradient(135deg, ${c.soft}, #ffffff)` }}>
            {p.image ? <img src={p.image} alt={p.title} loading="lazy" className="w-full h-full object-cover" /> : <CatIcon k={c.key} size={48} color={c.color} />}
          </div>
          <div className="p-3 flex flex-col flex-1">
            <h3 className="font-bold text-[#263238] leading-tight break-words text-sm">{p.title}</h3>
            {p.description && <p className="text-xs text-[#6b5f59] mt-1 leading-snug break-words">{p.description}</p>}
            <div className="flex flex-wrap items-center gap-2 mt-2 pt-1">
              {code && <button onClick={copyCode} className="inline-flex items-center gap-1 text-[11px] font-bold rounded-full px-2.5 py-1 border" style={{ color: textInk(c.color, c.soft), borderColor: c.color + '66', background: c.soft }}>{copied ? '✓ הועתק' : '📋 ' + code}</button>}
              <span className="inline-flex items-center gap-1 text-xs font-semibold" style={{ color: textInk(c.color) }}>לצפייה <ExternalLink size={12} /><span className="sr-only">(נפתח בחלון חדש)</span></span>
            </div>
          </div>
        </a>
      );
    };

    /* ====== מגירה (אקורדיון) ====== */
    const Drawer = ({ cat, desc, products, open, onToggle }) => {
      const fonts = React.useContext(FontsCtx);
      return (
      <div className="rounded-3xl overflow-hidden glam-card border border-[#f3e7dd] bg-white">
        {/* שם המגירה הוא כותרת של קטע — חייב לשבת בתגית H (ת"י 5568, סעיף 2.4.10 ברמת AA) */}
        <h2 className="m-0 font-normal">
        <button onClick={onToggle} aria-expanded={open} aria-controls={'drawer-' + cat.key}
          className="w-full flex items-center gap-3 p-5 text-right transition"
          style={{ background: open ? cat.soft : '#ffffff' }}>
          <span className="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0 ring-1 ring-white/60" style={{ background: cat.soft }}><CatIcon k={cat.key} size={24} color={cat.color} /></span>
          <span className="flex-1 text-lg sm:text-xl font-normal text-[#263238]" style={{ fontFamily: fontCss(fonts.drawerTitle) }}>{cat.label}</span>
          <Chevron size={22} className={"text-[#6f6058] transition-transform " + (open ? "rotate-180" : "")} />
        </button>
        </h2>
        <div className="drawer-body" id={'drawer-' + cat.key} role="region" aria-label={cat.label}
          style={{ maxHeight: open ? '4000px' : '0', opacity: open ? 1 : 0, visibility: open ? 'visible' : 'hidden' }}>
          <div className="p-4 pt-1" style={{ background: cat.soft + '55' }}>
            {desc && <p className="text-sm text-[#6b5f59] bg-white/70 rounded-2xl p-3.5 leading-relaxed whitespace-pre-line mb-3" style={{ fontFamily: fontCss(fonts.drawerDesc) }}>{desc}</p>}
            {products.length === 0
              ? <p className="text-center text-[#6f6058] py-4 text-sm">עדיין אין כאן מוצרים 🤍</p>
              : <div className="flex gap-3 overflow-x-auto snap-x snap-mandatory no-scrollbar pb-1 -mx-1 px-1">
                  {products.map(p => <div key={p.id} className="snap-start shrink-0 w-40"><ProductCard p={p} /></div>)}
                </div>}
          </div>
        </div>
      </div>
      );
    };

    /* ====== ממשק ניהול ====== */
    const Admin = ({ products, profileImg, onSaveProfile, settings, onSaveSettings, onAdd, onUpdate, onDelete, onExit }) => {
      const [form, setForm] = useState(EMPTY);
      const [editId, setEditId] = useState(null);
      const [saving, setSaving] = useState(false);
      const [err, setErr] = useState('');
      const [profSaving, setProfSaving] = useState(false);
      const [labels, setLabels] = useState(settings.labels);
      const [descs, setDescs] = useState(settings.descs);
      const [title, setTitle] = useState(settings.title);
      const [subtitle, setSubtitle] = useState(settings.subtitle);

      // טעינת כל הפונטים לתצוגה מקדימה ברשימת הבחירה (רק כשהניהול פתוח)
      useEffect(() => {
        const href = 'https://fonts.googleapis.com/css2?' +
          FONTS.map(f => 'family=' + encodeURIComponent(f).replace(/%20/g, '+')).join('&') + '&display=swap';
        let l = document.getElementById('dyn-fonts-all');
        if (!l) { l = document.createElement('link'); l.id = 'dyn-fonts-all'; l.rel = 'stylesheet'; document.head.appendChild(l); }
        l.href = href;
      }, []);

      const changeProfile = (file) => {
        if (!file) return;
        setProfSaving(true);
        resizeImage(file, async (dataUrl) => {
          try { await onSaveProfile(dataUrl); }
          catch (e) { alert('שגיאה בשמירת התמונה: ' + (e.message || e)); }
          finally { setProfSaving(false); }
        });
      };

      const [bgSaving, setBgSaving] = useState(false);
      const changeBg = (file) => {
        if (!file) return;
        setBgSaving(true);
        resizeImage(file, async (dataUrl) => {
          try { await onSaveSettings({ bg: dataUrl }); }
          catch (e) { alert('שגיאה בשמירת הרקע: ' + (e.message || e)); }
          finally { setBgSaving(false); }
        }, 1080);
      };

      const [heroSaving, setHeroSaving] = useState(false);
      const addBanner = (file) => {
        if (!file) return;
        setHeroSaving(true);
        resizeImage(file, async (dataUrl) => {
          try { await onSaveSettings({ banners: [...(settings.banners || []), dataUrl] }); }
          catch (e) { alert('שגיאה בשמירת הבאנר: ' + (e.message || e)); }
          finally { setHeroSaving(false); }
        }, 1200);
      };
      const removeBanner = (i) => onSaveSettings({ banners: (settings.banners || []).filter((_, idx) => idx !== i) });

      const [imgLoading, setImgLoading] = useState(false);

      // משיכה אוטומטית של תמונת המוצר מתוך הקישור
      const autoFetchImage = async (url) => {
        const u = (url || '').trim();
        if (!/^https?:\/\//i.test(u)) return;
        setImgLoading(true);
        try {
          let img = '';
          try {
            const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(u));
            const j = await r.json();
            img = (j && j.data && ((j.data.image && j.data.image.url) || (j.data.logo && j.data.logo.url))) || '';
          } catch (e) {}
          if (!img) {
            const r2 = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(u));
            const html = await r2.text();
            const m = html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i)
                   || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
            if (m) img = m[1];
          }
          if (img) img = img.replace(/^http:\/\//i, 'https://'); // מניעת חסימת תמונה לא-מאובטחת
          if (img) setForm(f => ({ ...f, image: img }));
        } catch (e) { /* בשקט — תמיד אפשר להוסיף תמונה ידנית */ }
        finally { setImgLoading(false); }
      };

      const startEdit = (p) => { setEditId(p.id); setForm({ ...p }); setErr(''); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const reset = () => { setEditId(null); setForm(EMPTY); setErr(''); };

      const submit = async (e) => {
        e.preventDefault();
        if (!form.title.trim() || !form.url.trim()) { setErr('צריך לפחות שם מוצר וקישור.'); return; }
        setSaving(true); setErr('');
        try {
          if (editId) await onUpdate(editId, form);
          else        await onAdd(form);
          reset();
        } catch (e) { setErr('שגיאה בשמירה: ' + (e.message || e)); }
        finally { setSaving(false); }
      };

      const pickImage = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => setForm(f => ({ ...f, image: ev.target.result }));
        reader.readAsDataURL(file);
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-8">
          <button onClick={onExit} className="flex items-center gap-1 text-[#6f6058] hover:text-[#263238] mb-4 text-sm">
            <Back size={16} /> חזרה לדף

          <h2 className="text-2xl font-extrabold text-[#263238] mb-1">ממשק ניהול</h2>
          <p className="text-[#6b5f59] mb-6 text-sm">הוספה ועריכה של מוצרים. השינויים נשמרים מיד ומופיעים לכולם.</p>

          {/* תמונת פרופיל */}
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-[#f0e3d8] mb-6">

                  <Upload size={16} /> {profSaving ? 'מעלה...' : (profileImg ? 'החלפת תמונה' : 'העלאת תמונה')}
                  <input type="file" accept="image/*" className="hidden" disabled={profSaving} onChange={e => changeProfile(e.target.files[0])} />
                </label>
                <p className="text-xs text-[#6f6058] mt-2">התמונה נשמרת מיד ומופיעה לכל מי שנכנס לדף.</p>
              </div>
            </div>
          </div>

          {/* רקע הדף */}
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-[#f0e3d8] mb-6">
            <h3 className="font-bold text-[#263238] mb-3">רקע הדף</h3>
            <div className="flex items-center gap-4">
              <div className="w-20 h-14 rounded-xl border border-[#e7d8cd] overflow-hidden flex-shrink-0 bg-[#FBF6F1] flex items-center justify-center"
                style={settings.bg ? { backgroundImage: `url(${settings.bg})`, backgroundSize: 'cover', backgroundPosition: 'center' } : {}}>
                {!settings.bg && <span className="text-[10px] text-[#6f6058]">ברירת מחדל</span>}
              </div>
              <div className="flex-1">
                <label className="inline-flex items-center gap-2 cursor-pointer bg-[#C59976] hover:bg-[#b3865f] text-[#2b1a10] text-sm font-semibold px-4 py-2.5 rounded-xl">
                  <Upload size={16} /> {bgSaving ? 'מעלה...' : (settings.bg ? 'החלפת רקע' : 'העלאת רקע')}
                  <input type="file" accept="image/*" className="hidden" disabled={bgSaving} onChange={e => changeBg(e.target.files[0])} />
                </label>
                {settings.bg && <button type="button" onClick={() => onSaveSettings({ bg: '' })} className="text-xs text-[#a25a62] hover:underline mr-3">הסרה (חזרה לברירת מחדל)</button>}
                <p className="text-xs text-[#6f6058] mt-2">מומלץ תמונה לאורך ובהירה. נדחסת אוטומטית לטעינה מהירה.</p>
              </div>
            </div>
          </div>

          {/* תמונות נושא (קרוסלת באנרים) */}
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-[#f0e3d8] mb-6">
            <h3 className="font-bold text-[#263238] mb-1">תמונות נושא (קרוסלה)</h3>
            <p className="text-xs text-[#6f6058] mb-3">העלי תמונה אחת או יותר — הן יוצגו בקרוסלה בראש הדף (במקום הראש הכהה). הכיתוב יופיע מתחתיהן.</p>
            <div className="flex flex-wrap gap-2 mb-3">
              {(settings.banners || []).map((b, i) => (
                <div key={i} className="relative w-24 h-14 rounded-xl overflow-hidden border border-[#e7d8cd]">
                  <img src={b} alt="תצוגה מקדימה של הבאנר" className="w-full h-full object-cover" />
                  <button type="button" onClick={() => removeBanner(i)} aria-label="הסרה"
                    className="absolute top-0.5 left-0.5 bg-black/55 text-white rounded-full w-5 h-5 leading-none text-xs flex items-center justify-center">×</button>
                </div>
              ))}
              {(!settings.banners || settings.banners.length === 0) &&
                <div className="w-24 h-14 rounded-xl border border-[#e7d8cd] bg-[#21403D] flex items-center justify-center text-[10px] text-white/70">כהה (ברירת מחדל)</div>}
            </div>
            <label className="inline-flex items-center gap-2 cursor-pointer bg-[#3E9B8C] hover:bg-[#46ab9a] text-[#2b1a10] text-sm font-semibold px-4 py-2.5 rounded-xl">
              <Upload size={16} /> {heroSaving ? 'מעלה...' : 'הוספת באנר'}
              <input type="file" accept="image/*" className="hidden" disabled={heroSaving} onChange={e => addBanner(e.target.files[0])} />
            </label>
            <p className="text-xs text-[#6f6058] mt-2">מומלץ תמונות רוחביות.</p>
          </div>

          {/* כותרת הדף וטקסט פתיחה */}
          <div className="bg-white rounded-3xl p-5 glam-card border border-[#f0e3d8] mb-6">
            <h3 className="font-bold text-[#263238] mb-1">כותרת הדף וטקסט פתיחה</h3>
            <p className="text-xs text-[#6f6058] mb-4">הטקסטים שמופיעים בראש הדף. נשמרים אוטומטית.</p>
            <label className="block text-sm font-semibold mb-1 text-[#263238]">כותרת ראשית</label>
            <input value={title} onChange={e => setTitle(e.target.value)} onBlur={() => onSaveSettings({ title })}
              className={INPUT} placeholder="הכותרת הגדולה בראש הדף" />
            <label className="block text-sm font-semibold mb-1 mt-4 text-[#263238]">טקסט פתיחה (כותרת משנה)</label>
            <textarea rows={4} value={subtitle} onChange={e => setSubtitle(e.target.value)} onBlur={() => onSaveSettings({ subtitle })}
              className={INPUT} placeholder="משפט/פסקה קצרה שמסבירה מי את ומה יש בדף" />
          </div>

          {/* בחירת פונטים לכל אזור */}
          <div className="bg-white rounded-3xl p-5 glam-card border border-[#f0e3d8] mb-6">
            <h3 className="font-bold text-[#263238] mb-1">פונטים</h3>
            <p className="text-xs text-[#6f6058] mb-4">בחרי פונט לכל אזור בדף. נשמר אוטומטית.</p>
            <div className="space-y-3">
              {[['title', 'כותרת ראשית'], ['subtitle', 'טקסט פתיחה'], ['drawerTitle', 'שמות המגירות'], ['drawerDesc', 'הסברי המגירות'], ['productText', 'טקסט המוצרים']].map(([slot, label]) => (
                <div key={slot} className="flex items-center gap-3">
                  <span className="text-sm text-[#263238] w-28 flex-shrink-0">{label}</span>
                  <select value={settings.fonts[slot]}
                    onChange={e => onSaveSettings({ fonts: { ...settings.fonts, [slot]: e.target.value } })}
                    className="flex-1 px-3 py-2 rounded-xl border border-[#e7d8cd] bg-white focus:outline-none focus:ring-2 focus:ring-[#ED8888]"
                    style={{ fontFamily: fontCss(settings.fonts[slot]) }}>
                    {FONTS.map(f => <option key={f} value={f} style={{ fontFamily: fontCss(f) }}>{f}</option>)}
                  </select>
                </div>
              ))}
            </div>
          </div>

          {/* עריכת המגירות: שם, הסבר ואייקון */}
          <div className="bg-white rounded-3xl p-5 glam-card border border-[#f0e3d8] mb-6">
            <h3 className="font-bold text-[#263238] mb-1">המגירות (נושאי הקישורים)</h3>
            <p className="text-xs text-[#6f6058] mb-4">ערכי את שם המגירה, הוסיפי הסבר קצר, ובחרי אייקון. השינויים נשמרים אוטומטית.</p>
            <div className="space-y-5">
              {CATEGORIES.map(c => {
                const current = (settings.icons && settings.icons[c.key]) || DEFAULT_ICONS[c.key];
                return (
                  <div key={c.key} className="rounded-2xl border border-[#f3e7dd] p-3" style={{ background: c.soft + '40' }}>
                    <input
                      value={labels[c.key]}
                      onChange={e => setLabels(prev => ({ ...prev, [c.key]: e.target.value }))}
                      onBlur={() => onSaveSettings({ labels })}
                      className="w-full bg-white rounded-lg px-3 py-2 font-semibold border border-[#e7d8cd] focus:outline-none focus:ring-2 focus:ring-[#ED8888]"
                      style={{ color: textInk(c.color) }} placeholder="שם המגירה" />
                    <textarea rows={4}
                      value={descs[c.key]}
                      onChange={e => setDescs(prev => ({ ...prev, [c.key]: e.target.value }))}
                      onBlur={() => onSaveSettings({ descs })}
                      className="w-full mt-2 bg-white rounded-lg px-3 py-2 text-sm border border-[#e7d8cd] focus:outline-none focus:ring-2 focus:ring-[#ED8888]"
                      placeholder="מלל חופשי — הסברים מקצועיים שיופיעו בראש המגירה (אפשר כמה שורות)" />
                    <div className="flex flex-wrap gap-2 mt-3">
                      {Object.keys(ICON_LIBRARY).map(name => {
                        const Ico = ICON_LIBRARY[name];
                        const sel = current === name;
                        return (
                          <button key={name} type="button" title={name}
                            onClick={() => onSaveSettings({ icons: { ...settings.icons, [c.key]: name } })}
                            className={"w-9 h-9 rounded-lg flex items-center justify-center border transition " + (sel ? "text-[#2b1a10] border-transparent shadow-sm" : "bg-white text-[#6b5f59] border-[#e7d8cd] hover:bg-[#fdf3ee]")}
                            style={sel ? { background: c.color } : {}}>
                            <Ico size={16} />
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* טופס הוספה / עריכה */}
          <form onSubmit={submit} className="bg-white rounded-3xl p-5 shadow-sm border border-[#f0e3d8] space-y-4 mb-8">
            <h3 className="font-bold text-[#263238]">{editId ? 'עריכת מוצר' : 'הוספת מוצר חדש'}</h3>
            <div>
              <label className="block text-sm font-semibold mb-1 text-[#263238]">מגירה</label>
              <div className="grid grid-cols-2 gap-2">
                {CATEGORIES.map(c => (
                  <button type="button" key={c.key} onClick={() => setForm(f => ({ ...f, category: c.key }))}
                    className={"flex items-center gap-2 p-2.5 rounded-xl border text-sm font-medium transition " + (form.category === c.key ? "text-[#2b1a10] border-transparent" : "bg-white text-[#263238] border-[#e7d8cd]")}
                    style={form.category === c.key ? { background: c.color } : {}}>
                    <CatIcon k={c.key} size={16} color={form.category === c.key ? '#fff' : c.color} /> {c.label}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label className="block text-sm font-semibold mb-1 text-[#263238]">שם המוצר *</label>
              <input className={INPUT} value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="למשל: כרית הנקה" />
            </div>
            <div>
              <label className="block text-sm font-semibold mb-1 text-[#263238]">קישור (לינק האפיליאייט) *</label>
              <input className={INPUT} dir="ltr" value={form.url}
                onChange={e => setForm(f => ({ ...f, url: e.target.value }))}
                onBlur={e => { if (!form.image) autoFetchImage(e.target.value); }}
                placeholder="https://..." />
              <p className="text-xs text-[#6f6058] mt-1">📷 תמונת המוצר תיטען אוטומטית מהקישור</p>
            </div>
            <div>
              <label className="block text-sm font-semibold mb-1 text-[#263238]">תיאור קצר (לא חובה)</label>
              <input className={INPUT} value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} placeholder="משפט קצר על המוצר" />
            </div>
            <div>
              <label className="block text-sm font-semibold mb-1 text-[#263238]">תמונה (נטענת אוטומטית — אפשר גם להחליף)</label>
              <div className="flex items-center gap-3">
                <div className="w-14 h-14 rounded-xl border border-[#e7d8cd] flex items-center justify-center overflow-hidden bg-[#FBF6F1] flex-shrink-0">
                  {imgLoading ? <span className="text-[10px] text-[#6f6058] animate-pulse">טוען…</span> : (form.image ? <img src={form.image} alt="תצוגה מקדימה של התמונה שנבחרה" className="w-full h-full object-cover" /> : <CatIcon k={form.category} size={22} color={catOf(form.category).color} />)}
                </div>
                <button type="button" onClick={() => autoFetchImage(form.url)} disabled={imgLoading || !form.url}
                  className="text-xs bg-[#f0e4dc] text-[#7c533c] px-3 py-2 rounded-lg disabled:opacity-50">טעינה מהקישור</button>
                <input type="file" accept="image/*" onChange={e => pickImage(e.target.files[0])} className="text-sm flex-1 min-w-0" />
                {form.image && <button type="button" onClick={() => setForm(f => ({ ...f, image: '' }))} className="text-xs text-[#a25a62] hover:underline">הסרה</button>}
              </div>
              <input className={INPUT + " mt-2 text-sm"} dir="ltr" value={form.image && !form.image.startsWith('data:') ? form.image : ''} onChange={e => setForm(f => ({ ...f, image: e.target.value }))} placeholder="או הדביקי כתובת תמונה https://..." />
            </div>
            {err && <p className="text-sm text-red-600">{err}</p>}
            <div className="flex gap-2">
              <button type="submit" disabled={saving} className="flex-1 bg-[#ED8888] hover:bg-[#e07373] text-[#2b1a10] font-bold py-3 rounded-xl flex items-center justify-center gap-2 disabled:opacity-60">
                <Plus size={18} /> {saving ? 'שומר...' : (editId ? 'שמירת שינויים' : 'הוספת מוצר')}
              </button>
              {editId && <button type="button" onClick={reset} className="px-4 py-3 rounded-xl border border-[#e7d8cd] text-[#6b5f59]">ביטול</button>}
            </div>
          </form>

          {/* רשימת המוצרים הקיימים */}
          <h3 className="font-bold text-[#263238] mb-3">המוצרים שלי ({products.length})</h3>
          <div className="space-y-5">
            {CATEGORIES.map(c => {
              const list = products.filter(p => p.category === c.key);
              return (
                <div key={c.key}>
                  <div className="flex items-center gap-2 mb-2 text-sm font-bold" style={{ color: textInk(c.color) }}><CatIcon k={c.key} size={15} color={c.color} /> {c.label} ({list.length})</div>
                  <div className="space-y-2">
                    {list.length === 0 && <p className="text-xs text-[#6f6058] pr-6">אין מוצרים במגירה הזו.</p>}
                    {list.map(p => (
                      <div key={p.id} className="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#f0e3d8]">
                        <div className="w-10 h-10 rounded-lg flex-shrink-0 flex items-center justify-center overflow-hidden text-lg" style={{ background: c.soft }}>
                          {p.image ? <img src={p.image} alt="" className="w-full h-full object-cover" /> : <CatIcon k={c.key} size={18} color={c.color} />}
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="font-semibold text-[#263238] text-sm truncate">{p.title}</div>
                          <div className="text-xs text-[#6f6058] truncate" dir="ltr">{p.url}</div>
                        </div>
                        <button onClick={() => startEdit(p)} className="p-2 text-[#6b5f59] hover:text-[#263238]"><Pencil size={16} /></button>
                        <button onClick={() => { if (confirm('למחוק את "' + p.title + '"?')) onDelete(p.id); }} className="p-2 text-[#a25a62] hover:text-red-600"><Trash size={16} /></button>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    /* ====== תוסף נגישות (ת"י 5568 רמה AA — ראו ACCESSIBILITY.md) ======
       מתגים: גודל טקסט · ניגודיות גבוהה · הדגשת קישורים · גופן קריא · עצירת אנימציות · איפוס
       ההעדפה נשמרת בדפדפן ונטענת אוטומטית בכל ביקור.
       הצהרת הנגישות נפתחת גם מכאן וגם מהקישור שבתחתית הדף. */
    function AccessibilityWidget() {
      const [open, setOpen] = useState(false);
      const [font, setFont] = useState(() => +(localStorage.getItem('a11y_font') || 0));
      const [contrast, setContrast] = useState(() => localStorage.getItem('a11y_contrast') === '1');
      const [links, setLinks] = useState(() => localStorage.getItem('a11y_links') === '1');
      const [readable, setReadable] = useState(() => localStorage.getItem('a11y_readable') === '1');
      const [noMotion, setNoMotion] = useState(() => localStorage.getItem('a11y_motion') === '1');
      const [stmt, setStmt] = useState(false);
      const fabRef = React.useRef(null);
      const panelRef = React.useRef(null);
      const stmtRef = React.useRef(null);

      useEffect(() => {
        const h = document.documentElement;
        h.classList.toggle('a11y-font-1', font === 1);
        h.classList.toggle('a11y-font-2', font === 2);
        h.classList.toggle('a11y-contrast', contrast);
        h.classList.toggle('a11y-links', links);
        h.classList.toggle('a11y-readable', readable);
        h.classList.toggle('a11y-no-motion', noMotion);
        localStorage.setItem('a11y_font', font);
        localStorage.setItem('a11y_contrast', contrast ? '1' : '0');
        localStorage.setItem('a11y_links', links ? '1' : '0');
        localStorage.setItem('a11y_readable', readable ? '1' : '0');
        localStorage.setItem('a11y_motion', noMotion ? '1' : '0');
      }, [font, contrast, links, readable, noMotion]);

      /* פתיחת ההצהרה גם מהקישור שבפוטר */
      useEffect(() => {
        const openStmt = () => setStmt(true);
        window.addEventListener('open-a11y-statement', openStmt);
        return () => window.removeEventListener('open-a11y-statement', openStmt);
      }, []);

      /* Esc סוגר — והפוקוס חוזר לכפתור שממנו נפתח (חובה בת"י 5568) */
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== 'Escape') return;
          if (stmt) setStmt(false);
          else if (open) { setOpen(false); if (fabRef.current) fabRef.current.focus(); }
        };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [open, stmt]);

      /* העברת הפוקוס אל החלונית שנפתחה */
      useEffect(() => { if (open && panelRef.current) panelRef.current.focus(); }, [open]);
      useEffect(() => { if (stmt && stmtRef.current) stmtRef.current.focus(); }, [stmt]);

      /* כליאת Tab בתוך חלונית ההצהרה, כדי שלא "יברח" לרקע */
      const trapTab = (e) => {
        if (e.key !== 'Tab' || !stmtRef.current) return;
        const f = stmtRef.current.querySelectorAll('a[href], button, input, textarea, select, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      };

      const reset = () => { setFont(0); setContrast(false); setLinks(false); setReadable(false); setNoMotion(false); };
      const Toggle = ({ on, onClick, children }) => (
        <button onClick={onClick} aria-pressed={on}
          className={`w-full min-h-[44px] text-right px-4 py-2.5 rounded-xl border text-sm font-medium transition flex items-center justify-between ${on ? 'bg-[#3E9B8C] text-[#2b1a10] border-[#3E9B8C]' : 'bg-[#FBF6F1] text-[#263238] border-[#f0e3d8] hover:bg-[#fdf3ee]'}`}>
          <span>{children}</span><span aria-hidden="true">{on ? '✓' : ''}</span>
        </button>
      );

      return (
        <div className="fixed bottom-4 left-4 z-[60]">
          {open && (
            <div ref={panelRef} tabIndex={-1} role="dialog" aria-label="תפריט נגישות" className="mb-3 w-64 bg-white rounded-2xl shadow-xl border border-[#f0e3d8] p-4">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-bold text-[#263238]">נגישות</h3>
                <button onClick={() => { setOpen(false); if (fabRef.current) fabRef.current.focus(); }} aria-label="סגירת תפריט נגישות" className="text-[#a25a62] text-2xl leading-none w-11 h-11 flex items-center justify-center">×</button>
              </div>
              <div className="space-y-2">
                <div className="flex gap-2">
                  <button onClick={() => setFont(Math.max(0, font - 1))} aria-label="הקטנת טקסט" className="flex-1 min-h-[44px] py-2 rounded-xl border border-[#f0e3d8] bg-[#FBF6F1] hover:bg-[#fdf3ee] font-bold text-[#263238]">א-</button>
                  <button onClick={() => setFont(Math.min(2, font + 1))} aria-label="הגדלת טקסט" className="flex-1 min-h-[44px] py-2 rounded-xl border border-[#f0e3d8] bg-[#FBF6F1] hover:bg-[#fdf3ee] font-bold text-[#263238]">א+</button>
                </div>
                <Toggle on={contrast} onClick={() => setContrast(!contrast)}>ניגודיות גבוהה</Toggle>
                <Toggle on={links} onClick={() => setLinks(!links)}>הדגשת קישורים</Toggle>
                <Toggle on={readable} onClick={() => setReadable(!readable)}>גופן קריא</Toggle>
                <Toggle on={noMotion} onClick={() => setNoMotion(!noMotion)}>עצירת אנימציות</Toggle>
                <button onClick={reset} className="w-full min-h-[44px] py-2 rounded-xl border border-[#f0e3d8] text-[#263238] hover:bg-[#fdf3ee] text-sm">איפוס</button>
                <button onClick={() => setStmt(true)} className="w-full text-xs text-[#6b5f59] underline pt-1 min-h-[44px]">הצהרת נגישות</button>
              </div>
            </div>
          )}

          <button ref={fabRef} onClick={() => setOpen(!open)} aria-expanded={open} aria-haspopup="dialog"
            aria-label={open ? 'סגירת תפריט נגישות' : 'פתיחת תפריט נגישות'}
            className="w-14 h-14 rounded-full bg-[#3E9B8C] hover:bg-[#46ab9a] text-[#2b1a10] shadow-lg flex items-center justify-center border-2 border-white">
            <Accessibility size={28} />
          </button>

          {stmt && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-6 z-[70]" onClick={() => setStmt(false)}>
              <div ref={stmtRef} tabIndex={-1} role="dialog" aria-modal="true" aria-labelledby="a11y-stmt-title" onKeyDown={trapTab}
                className="bg-white rounded-2xl p-6 max-w-md w-full text-right max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <h3 id="a11y-stmt-title" className="text-xl font-bold text-[#263238] mb-3">הצהרת נגישות</h3>
                <p className="text-sm text-[#263238] leading-relaxed mb-3">
                  אנו רואים חשיבות רבה בהנגשת הדף לכלל המשתמשים/ות. הדף פותח בהתאם לעקרונות התקן הישראלי (ת"י 5568) ברמת AA, וכולל רכיב נגישות: הגדלת טקסט, ניגודיות גבוהה, הדגשת קישורים, גופן קריא ועצירת אנימציות.
                </p>
                <p className="text-sm text-[#263238] leading-relaxed mb-3">
                  בנוסף הדף כולל: ניווט מלא במקלדת עם סימון פוקוס ברור, קישור לדילוג לתוכן הראשי, תיאורי טקסט לתמונות ולכפתורים, תוויות לשדות הטופס, ומבנה כותרות תקין לקוראי מסך.
                </p>
                <p className="text-sm text-[#263238] leading-relaxed mb-3">
                  <strong>מגבלות ידועות:</strong> תוכן שמגיע מגורמים חיצוניים (תמונות מוצר וקישורים לאתרי מכירה) אינו בשליטתנו וייתכן שאינו נגיש במלואו. אנחנו פועלות לשפר זאת באופן שוטף.
                </p>
                <p className="text-sm text-[#263238] leading-relaxed mb-3">
                  <strong>רכז/ת נגישות:</strong> אביטל עציון · טלפון <a className="underline text-[#a25a62]" href="tel:+972548780808">054-878-0808</a> · דוא"ל <a className="underline text-[#a25a62]" href="mailto:avital.mpt.ibclc@gmail.com">avital.mpt.ibclc@gmail.com</a>
                </p>
                <p className="text-sm text-[#263238] leading-relaxed mb-4">
                  נתקלת בקושי בנגישות? נשמח שתפני אלינו ונטפל בהקדם. ההצהרה עודכנה בספטמבר 2026.
                </p>
                <button onClick={() => setStmt(false)} className="w-full min-h-[44px] bg-[#3E9B8C] hover:bg-[#46ab9a] text-[#2b1a10] font-bold py-3 rounded-xl">סגירה</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ====== קרוסלת באנרים — החלפה אוטומטית + נקודות אינדיקציה ====== */
    const BannerCarousel = ({ banners }) => {
      const [idx, setIdx] = useState(0);
      const [paused, setPaused] = useState(false);
      useEffect(() => {
        if (!banners || banners.length <= 1 || paused) return;
        // כיבוד העדפת עצירת אנימציות במערכת ההפעלה — לא מחליפים אוטומטית
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const t = setInterval(() => {
          // כיבוד מתג "עצירת אנימציות" שברכיב הנגישות (נבדק בכל פעימה, כדי שיפעל מיד)
          if (document.documentElement.classList.contains('a11y-no-motion')) return;
          setIdx(i => (i + 1) % banners.length);
        }, 4500);
        return () => clearInterval(t);
      }, [banners.length, paused]);
      useEffect(() => { if (idx >= banners.length) setIdx(0); }, [banners.length]);
      return (
        <div className="relative w-full h-44 sm:h-60 bg-[#21403D] overflow-hidden" style={{ borderBottomLeftRadius: '30px', borderBottomRightRadius: '30px' }}>
          {banners.map((b, i) => (
            <img key={i} src={b} alt="" className="absolute inset-0 w-full h-full object-cover transition-opacity duration-700" style={{ opacity: i === idx ? 1 : 0 }} />
          ))}
          {banners.length > 1 && (
            <div className="absolute bottom-3 left-0 right-0 flex justify-center items-center gap-1.5">
              <button onClick={() => setPaused(!paused)} aria-label={paused ? 'הפעלת החלפת הבאנרים' : 'עצירת החלפת הבאנרים'}
                className="h-11 w-11 flex items-center justify-center text-white text-xs rounded-full bg-black/40">
                <span aria-hidden="true">{paused ? '▶' : '❚❚'}</span>
              </button>
              {banners.map((_, i) => (
                <button key={i} onClick={() => setIdx(i)} aria-label={'מעבר לבאנר ' + (i + 1)} aria-current={i === idx}
                  className="h-11 w-6 flex items-center justify-center">
                  <span className="rounded-full transition-all block" style={{ width: i === idx ? 20 : 7, height: 7, background: i === idx ? '#ffffff' : 'rgba(255,255,255,.5)' }} />
                </button>
              ))}
            </div>
          )}
        </div>
      );
    };

    /* ====== האפליקציה ====== */
    function App() {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);
      const [openKey, setOpenKey] = useState(null);
      const [admin, setAdmin] = useState(false);
      const [profileImg, setProfileImg] = useState('');
      const [metaId, setMetaId] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);

      const load = async () => {
        setLoading(true); setLoadError(null);
        try {
          const { data, error } = await sb.from(TABLE).select('*').order('sort_order', { ascending: true }).order('id', { ascending: true });
          if (error) throw error;
          const rows = (data || []).map(fromDb);
          const meta = rows.find(r => r.category === '_meta');
          if (meta) {
            setProfileImg(meta.image || '');
            setMetaId(meta.id);
            if (meta.description) {
              try {
                const parsed = JSON.parse(meta.description);
                // תאימות לאחור: אם נשמר רק מילון אייקונים שטוח
                const obj = (parsed.icons || parsed.labels || parsed.descs) ? parsed : { icons: parsed };
                setSettings(mergeSettings(DEFAULT_SETTINGS, obj));
              } catch (e) {}
            }
          }
          setProducts(rows.filter(r => CATEGORIES.some(c => c.key === r.category)));
        } catch (e) {
          console.error(e);
          setLoadError('שגיאה בטעינת המוצרים. רענני את הדף ונסי שוב.');
        } finally { setLoading(false); }
      };
      useEffect(() => { load(); document.title = BRAND_NAME + ' — ההמלצות שלי'; }, []);
      useEffect(() => { ensureFonts(settings.fonts); }, [settings.fonts]);

      const add = async (p) => {
        const { data, error } = await sb.from(TABLE).insert(toDb(p)).select().single();
        if (error) throw error;
        setProducts(prev => [...prev, fromDb(data)]);
      };
      const update = async (id, p) => {
        const { data, error } = await sb.from(TABLE).update(toDb(p)).eq('id', id).select().single();
        if (error) throw error;
        setProducts(prev => prev.map(x => x.id === id ? fromDb(data) : x));
      };
      const remove = async (id) => {
        const { error } = await sb.from(TABLE).delete().eq('id', id);
        if (error) { alert('שגיאה במחיקה'); return; }
        setProducts(prev => prev.filter(x => x.id !== id));
      };

      // עדכון שורת ההגדרות המיוחדת _meta (תמונת פרופיל + אייקונים), שאינה מוצר
      const upsertMeta = async (patch) => {
        if (metaId) {
          const { error } = await sb.from(TABLE).update(patch).eq('id', metaId);
          if (error) throw error;
        } else {
          const { data, error } = await sb.from(TABLE).insert({ category: '_meta', title: 'profile', url: '-', ...patch }).select().single();
          if (error) throw error;
          setMetaId(data.id);
        }
      };
      const saveProfile = async (dataUrl) => { await upsertMeta({ image: dataUrl }); setProfileImg(dataUrl); };
      const saveSettings = async (partial) => {
        const next = mergeSettings(settings, partial);
        setSettings(next);
        await upsertMeta({ description: JSON.stringify(next) });
      };

      const tryAdmin = () => {
        const code = prompt('הזיני סיסמת ניהול:');
        if (code === null) return;
        if (code === ADMIN_CODE) setAdmin(true);
        else alert('סיסמה שגויה');
      };

      if (admin) return (
        <CatIconCtx.Provider value={settings.icons}>
        <FontsCtx.Provider value={settings.fonts}>
          <Admin products={products} profileImg={profileImg} onSaveProfile={saveProfile}
            settings={settings} onSaveSettings={saveSettings}
            onAdd={add} onUpdate={update} onDelete={remove} onExit={() => setAdmin(false)} />
        </FontsCtx.Provider>
        </CatIconCtx.Provider>
      );

      return (
        <CatIconCtx.Provider value={settings.icons}>
        <FontsCtx.Provider value={settings.fonts}>
        <div className="min-h-screen pb-16 w-full overflow-x-hidden">
          {/* שכבת רקע קבועה (יציבה במובייל, בלי חיתוך) */}
          {settings.bg && <div aria-hidden="true" style={{ position: 'fixed', inset: 0, zIndex: -1, backgroundImage: `url(${settings.bg})`, backgroundSize: 'cover', backgroundPosition: 'center' }} />}
          {/* כניסת ניהול קבועה (נגישה תמיד) */}
          <button onClick={tryAdmin} title="ניהול" aria-label="כניסה לאזור הניהול"
            className="fixed top-3 left-3 z-50 bg-white/80 backdrop-blur border border-[#f0e3d8] text-[#6b5f59] hover:text-[#263238] rounded-full p-2 shadow-sm">
            <Lock size={16} />
          </button>

          {/* כותרת */}
          {(settings.banners && settings.banners.length) ? (
            /* Hero עם קרוסלת באנרים — רק התמונות למעלה, והכיתוב מתחתיהן */
            <header className="mb-2">
              <BannerCarousel banners={settings.banners} />
              <div className="text-center px-5 pt-6 pb-4 max-w-xl mx-auto">
                <div className="mb-4 flex justify-center">
                  <div className="rounded-full p-[3px] bg-gradient-to-tr from-[#7E5EA8] via-[#9E84C9] to-[#2e7a6f] shadow-lg">
                    <ProfilePic size={104} src={profileImg} />
                  </div>
                </div>
                <h1 className="text-3xl sm:text-4xl font-normal text-[#2F4F4B]" style={{ fontFamily: fontCss(settings.fonts.title) }}>{settings.title}</h1>
                <div className="flex items-center justify-center gap-3 my-4">
                  <span className="h-px w-12 bg-gradient-to-l from-transparent to-[#C99A5B]"></span>
                  <span className="gold-text text-lg leading-none">✦</span>
                  <span className="h-px w-12 bg-gradient-to-r from-transparent to-[#C99A5B]"></span>
                </div>
                <p className="text-[#556663] leading-relaxed text-[15px] sm:text-base max-w-md mx-auto whitespace-pre-line" style={{ fontFamily: fontCss(settings.fonts.subtitle) }}>
                  {settings.subtitle}
                </p>
              </div>
            </header>
          ) : (
            /* Hero כהה דרמטי (ברירת מחדל, כשאין תמונת נושא) */
            <header className="hero-dark text-center px-5 pt-14 pb-12 mb-2" style={{ borderBottomLeftRadius: '44px', borderBottomRightRadius: '44px' }}>
              <div className="max-w-xl mx-auto">
                <div className="mb-5 flex justify-center">
                  <div className="rounded-full p-[3px] bg-gradient-to-tr from-[#7E5EA8] via-[#9E84C9] to-[#2e7a6f] shadow-[0_8px_40px_-6px_rgba(126,94,168,0.7)]">
                    <ProfilePic size={132} src={profileImg} />
                  </div>
                </div>
                <h1 className="holo-text text-4xl sm:text-5xl font-normal tracking-tight drop-shadow" style={{ fontFamily: fontCss(settings.fonts.title) }}>{settings.title}</h1>
                <div className="flex items-center justify-center gap-3 my-4">
                  <span className="h-px w-12 bg-gradient-to-l from-transparent to-[#6FD0BE]"></span>
                  <span className="holo-text text-lg leading-none">✦</span>
                  <span className="h-px w-12 bg-gradient-to-r from-transparent to-[#6FD0BE]"></span>
                </div>
                <p className="text-[#C8DAD5] leading-relaxed text-[15px] sm:text-base max-w-md mx-auto whitespace-pre-line" style={{ fontFamily: fontCss(settings.fonts.subtitle) }}>
                  {settings.subtitle}
                </p>
              </div>
            </header>
          )}

          {/* המגירות */}
          <main id="main" tabIndex={-1} className="max-w-xl mx-auto px-4 space-y-4">
            {loading && <p role="status" aria-live="polite" className="text-center text-[#6f6058] py-10">טוען מוצרים...</p>}
            {loadError && <p role="alert" className="text-center text-sm text-[#a25a62] bg-[#fbeeee] rounded-xl py-3 px-4">{loadError}</p>}
            {!loading && CATEGORIES.filter(cat => products.some(p => p.category === cat.key)).map(cat => (
              <Drawer key={cat.key} cat={{ ...cat, label: settings.labels[cat.key] || cat.label }}
                desc={settings.descs[cat.key] || ''}
                products={products.filter(p => p.category === cat.key)}
                open={openKey === cat.key}
                onToggle={() => setOpenKey(openKey === cat.key ? null : cat.key)} />
            ))}
          </main>

          {/* גילוי נאות + כניסת ניהול */}
          <footer className="max-w-xl mx-auto px-5 mt-10 text-center">
            <p className="text-xs text-[#556663] leading-relaxed">כל הקישורים כאן הם קישורי שותפים (אפיליאייט) — רכישה דרכם מזכה אותי בעמלה קטנה, ללא תוספת עלות לכן 🤍</p>
            <p className="mt-3 text-xs text-[#556663] leading-relaxed bg-white/60 rounded-xl px-4 py-3">
              ⚠️ התוכן בדף זה הוא להשראה והמלצה כללית בלבד, ואינו מהווה ייעוץ רפואי, מקצועי או אישי. בכל שאלה או החלטה יש להתייעץ עם איש/אשת מקצוע מוסמך/ת.
            </p>
            <p className="mt-6 text-sm text-[#556663]">
              נבנה באהבה על ידי <a href="https://avitaletzion.com" target="_blank" rel="noopener noreferrer" className="font-semibold text-[#7E5EA8] hover:text-[#2e7a6f] underline decoration-[#cdbce4] underline-offset-2">אביטל עציון<span className="sr-only"> (נפתח בחלון חדש)</span></a> 💜
            </p>
            {/* נגישות: ההצהרה חייבת להיות נגישה גם מהפוטר, לא רק מרכיב הנגישות */}
            <p className="mt-4">
              <button onClick={() => window.dispatchEvent(new CustomEvent('open-a11y-statement'))}
                className="text-xs text-[#6b5f59] hover:text-[#263238] underline underline-offset-2 py-2 px-2">הצהרת נגישות</button>
            </p>
            <button onClick={tryAdmin} className="mt-1 inline-flex items-center gap-1 text-[#6b5f59] hover:text-[#6b5f59] text-xs">
              <Lock size={13} /> ניהול
            </button>
          </footer>
          <AccessibilityWidget />
        </div>
        </FontsCtx.Provider>
        </CatIconCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
